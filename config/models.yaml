# Registry model. Chi 'supported' sau khi smoke test khoi tao + suy luan dat (cvat_tools detect smoke).
# Trang thai backend duoc cap nhat boi `python -m cvat_tools models smoke`.
models:
  yolo26n:
    task: detect
    version: yolo26n (ultralytics 8.4.x)
    checkpoint: yolo26n.pt
    sha256_16: 9b09cc8bf347f0fc
    source: https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo26n.pt
    license: AGPL-3.0 (Ultralytics)
    hardware: CPU, RAM >= 4GB (nano)
    classes: [person]
    inference: {imgsz: 640, conf: 0.25, iou: 0.7}
    backends:
      pytorch: unverified
      onnx: unverified
      openvino: unverified
      openvino_fp16: unverified
      openvino_int8: unverified
    benchmark: data/benchmarks/detector_bench.csv
